name: Hook Selftest

# Testet die Schutzmechanismen des Templates (protect-secrets.sh, verify.sh,
# secret-scan.sh, .githooks/pre-commit) gegen ihre Exit-Code-Verträge —
# siehe tests/hook-selftest.sh.
#
# Läuft NUR in diesem Template-Repo (Repo-Guard unten): Zielprojekte testen
# ihre eigene Fachlichkeit, nicht die Template-Infrastruktur. setup.sh kopiert
# diesen Workflow deshalb auch nicht mit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hook-selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: hook selftest (nur Template-Repo)
    if: github.repository == 'MichiBl/Claude-Code-Default-Repo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Gleiche gepinnte gitleaks-Version wie secret-scan.yml (Binary-Pin).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pinned gitleaks binary (verified checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Integrität gegen die offiziell veröffentlichten Checksummen prüfen.
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run hook selftest
        run: ./tests/hook-selftest.sh
