name: Hook Selftest

# Testet die Schutzmechanismen des Templates (protect-secrets.sh, verify.sh,
# secret-scan.sh, .githooks/pre-commit, .githooks/pre-push) gegen ihre
# Exit-Code-Verträge —
# siehe tests/hook-selftest.sh.
#
# Läuft NUR in diesem Template-Repo (Repo-Guard unten): Zielprojekte testen
# ihre eigene Fachlichkeit, nicht die Template-Infrastruktur. setup.sh kopiert
# diesen Workflow deshalb auch nicht mit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hook-selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: hook selftest (nur Template-Repo)
    if: github.repository == 'MichiBl/Claude-Code-Default-Repo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Gleiche gepinnte gitleaks-Version + Hash wie secret-scan.yml
      # (Binary-Pin; der Selbsttest erzwingt die Übereinstimmung).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned gitleaks binary (verified checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          # Gegen den IM WORKFLOW gepinnten Hash prüfen, nicht gegen die
          # checksums.txt des Releases: die käme aus derselben Quelle wie das
          # Binary — ein kompromittiertes Release tauschte beide zusammen.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Static analysis (shellcheck)
        # Das Produkt dieses Repos sind Shellskripte, und der Selbsttest prüft
        # nur Exit-Code-Verträge — ungequotete Expansionen, tote Zuweisungen
        # oder in Pipes verschluckte Exit-Codes sieht er nicht.
        # Schwelle "warning": darunter liegt bei shellcheck vor allem Stilistik.
        # Aus dem Ubuntu-Paket statt aus einer Third-Party-Action — eine
        # unvertraute Abhängigkeit weniger, gleiche Begründung wie bei gitleaks
        # in secret-scan.yml.
        # ACHTUNG: shellcheck kennt kein Bash-3.2-Ziel. Die Kompatibilität, auf
        # die dieses Repo festgelegt ist, prüft dieser Step NICHT.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          shellcheck -s bash -S warning \
            .claude/hooks/*.sh \
            .githooks/pre-commit .githooks/pre-push \
            setup.sh setup-github.sh \
            tests/hook-selftest.sh

      - name: Run hook selftest
        run: ./tests/hook-selftest.sh
