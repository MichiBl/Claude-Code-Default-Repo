name: Secret Scan

# Hartes Gate gegen Secrets/Keys im Repo. Läuft auf jedem PR gegen main und
# auf Pushes nach main; ein Fund lässt den Check fehlschlagen und blockt
# (mit Branch Protection) den Merge.
#
# Nutzt das gepinnte gitleaks-Binary direkt statt einer Third-Party-Action —
# eine unvertraute Abhängigkeit weniger in der Supply Chain des Security-Gates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (hard gate)
    runs-on: ubuntu-latest
    env:
      # Gepinnte gitleaks-Version (Binary-Pin, keine Tag-Drift).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks binary (verified checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Integrität gegen die offiziell veröffentlichten Checksummen prüfen.
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (hard gate)
        # Scannt die volle Git-Historie. --redact hält den Secret-Wert aus
        # dem CI-Log. Ohne .gitleaks.toml greifen die gitleaks-Defaults.
        run: |
          CONFIG_ARGS=""
          [ -f .gitleaks.toml ] && CONFIG_ARGS="--config .gitleaks.toml"
          gitleaks git \
            $CONFIG_ARGS \
            --redact \
            --exit-code 1 \
            --no-banner \
            --verbose \
            .
