# Dependabot — hält die SHA-gepinnten GitHub Actions aktuell.
# Ohne dieses File veralten die Pins in den Workflows still (keine Security-
# Updates, keine neuen Versionen). PRs kommen wöchentlich freitags, gebündelt.
#
# `day` bleibt gesetzt: ohne den Schlüssel verteilt GitHub die Läufe selbst
# über die Woche, und die Repos laufen an unterschiedlichen Tagen.
#
# `cooldown` überspringt frisch veröffentlichte Versionen. Der Fehlmodus dahinter
# ist NICHT eine bekannte Lücke, sondern das Gegenteil: wird eine Paketversion
# kompromittiert, gibt es dafür tagelang keinen CVE-Eintrag — das Audit schweigt,
# die CI ist grün, und Dependabot macht brav einen PR darauf. Die meisten solchen
# Vorfälle fliegen innerhalb einer Woche auf. GitHub wartet seit 14.07.2026 von
# sich aus 3 Tage; 7 kosten bei wöchentlichen Läufen praktisch nichts mehr.
# Security-Updates (CVE) sind davon ausgenommen und kommen weiterhin sofort.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Projektspezifisch aktivieren (einkommentieren + anpassen):
  #
  # `npm` deckt auch pnpm und yarn ab — ein eigenes pnpm-Ökosystem gibt es
  # nicht, Dependabot erkennt die pnpm-lock.yaml selbst. pnpm-Projekte setzen
  # zusätzlich `minimumReleaseAge: 10080` (7 Tage, in Minuten; pnpm >= 10.16)
  # in der pnpm-workspace.yaml: cooldown bremst nur Dependabot-PRs, nicht ein
  # manuelles `pnpm add`/`pnpm update` — erst beides schließt die Lücke.
  #
  # - package-ecosystem: npm      # npm, pnpm und yarn
  #   directory: /
  #   schedule:
  #     interval: weekly
  #     day: friday
  #   cooldown:
  #     default-days: 7
  #
  # - package-ecosystem: pip        # bei uv.lock stattdessen: uv
  #   directory: /
  #   schedule:
  #     interval: weekly
  #     day: friday
  #   cooldown:
  #     default-days: 7
